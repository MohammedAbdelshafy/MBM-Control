# Gitleaks config for MBM-Control
# The Security workflow (.github/workflows/security.yml) runs `gitleaks detect`
# with fetch-depth: 0, i.e. a FULL-history scan. This allowlist covers
# categories reviewed on 2026-10-05 (321 findings, zero live production
# secrets found) so the scan catches NEW real leaks instead of re-failing on
# fixtures, examples, and generated artifacts forever.
#
# WARNING: anything committed under an allowlisted path is silently ignored by
# the scanner. Never put real credentials under these paths.
#
# Reviewed categories (2026-10-05):
# - MBM/Artifacts/GTM/** : generated notification artifacts; the flagged
#   `delivery_key` values are internal UUIDs, not credentials (262 findings).
# - Test fixtures (tests/, *.test.js, test_*.py): dummy tokens matching secret
#   patterns (18 findings).
# - .env.example files: placeholders by design (6 findings).
# - Committed .next/ build output: generated files (6 findings).
#
# NOTE: gitleaks allows only ONE top-level [allowlist] table, so all paths
# live in the single list below.

title = "MBM-Control gitleaks config"

[allowlist]
description = "Known-benign: test fixtures, .env.example placeholders, generated GTM artifacts, .next build output"
paths = [
  # test fixtures with dummy tokens
  '''.*/tests?/.*''',
  '''.*\.test\.[jt]sx?''',
  '''.*/test_[^/]*\.py''',
  # .env.example placeholders
  '''.*\.env\.example$''',
  # generated GTM notification artifacts (delivery_key UUIDs, not credentials)
  '''MBM/Artifacts/GTM/.*''',
  # committed build output
  '''.*/\.next/.*''',
]
