name: Telegram Notify
description: Send a Markdown message to the ops Telegram channel AND persist it in Supabase `notifications`. Safe no-op when secrets are unset.

inputs:
  message:
    description: Markdown message text (keep to a single line; use \n escaped newlines)
    required: true
  event:
    description: Notification event tag stored in Supabase (e.g. ci:hourly-failure)
    required: false
    default: ci:notification
  telegram_bot_token:
    description: Telegram bot token (pass the TELEGRAM_BOT_TOKEN secret at the call site)
    required: false
    default: ''
  telegram_chat_id:
    description: Telegram chat id (pass the TELEGRAM_CHAT_ID secret at the call site)
    required: false
    default: ''
  vite_supabase_url:
    description: Supabase URL (pass the VITE_SUPABASE_URL secret at the call site)
    required: false
    default: ''
  supabase_service_role_key:
    description: Supabase service role key (pass the SUPABASE_SERVICE_ROLE_KEY secret at the call site)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Send + persist notification
      shell: bash
      env:
        TELEGRAM_BOT_TOKEN: ${{ inputs.telegram_bot_token }}
        TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}
        VITE_SUPABASE_URL: ${{ inputs.vite_supabase_url }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ inputs.supabase_service_role_key }}
      run: |
        python MBM/Scripts/notify_lib.py \
          --event "${{ inputs.event }}" \
          --message "${{ inputs.message }}"
