name: Single-Writer Contract

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    name: Python ${{ matrix.python-version }} single-writer contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest 'pydantic>=2.0'

      - name: Run single-writer regression tests
        run: python -m pytest MBM/LeadEngine/tests/test_single_writer_contract.py -q
