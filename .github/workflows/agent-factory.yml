name: Agent Factory - Voice Agent Batch (Every 5 Min)

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:  # Allow manual trigger

jobs:
  create-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests python-dotenv
      
      - name: Create voice agent batch
        env:
          RETELL_API_KEY: ${{ secrets.RETELL_API_KEY }}
        run: python MBM/LeadEngine/agent_factory.py --count 2

  notify-failure:
    runs-on: ubuntu-latest
    if: failure()
    needs: create-agent
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Alert on agent factory failure
        uses: ./.github/actions/telegram-notify
        with:
          message: "🛑 *BASE44 AGENT FACTORY* voice agent batch FAILED (5-min cycle broken)\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
