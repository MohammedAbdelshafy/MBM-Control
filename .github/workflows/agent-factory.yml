name: Agent Factory - Voice Agent Batch (Every 5 Min)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# NOTE on reruns: GitHub re-executes a rerun against the ORIGINAL triggering
# SHA — it can never pick up newer hotfixes. If a batch fails after a fix has
# been pushed, use "Run workflow" (workflow_dispatch) instead of "Re-run".
concurrency:
  group: mbm-agent-factory-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # First-party actions pinned to SHAs observed resolving in production
      # runs (supply-chain hardening); bump deliberately, not implicitly.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Assert checked-out revision
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "Running factory revision: ${GITHUB_SHA}"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --disable-pip-version-check requests python-dotenv

      - name: Preflight factory source
        run: |
          python -m py_compile MBM/LeadEngine/agent_factory.py
          python MBM/LeadEngine/agent_factory.py --status || true

      - name: Create voice agent batch
        env:
          RETELL_API_KEY: ${{ secrets.RETELL_API_KEY }}
        run: python MBM/LeadEngine/agent_factory.py --count 2

      - name: Upload failure ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # run_attempt suffix prevents artifact-name collisions when a failed
          # run is re-executed (attempt >= 2).
          name: agent-factory-ledger-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: MBM/LeadEngine/logs/factory_attempts.json
          if-no-files-found: ignore
          retention-days: 14

  notify-failure:
    runs-on: ubuntu-latest
    if: failure()
    needs: create-agent
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Alert on agent factory failure
        uses: ./.github/actions/telegram-notify
        with:
          message: "\U0001F6A8 *BASE44 AGENT FACTORY* voice agent batch FAILED\nJob: create-agent (conclusion: ${{ needs.create-agent.result }})\nRevision: ${{ github.sha }}\nAttempt: ${{ github.run_attempt }}\nLedger artifact: agent-factory-ledger-${{ github.run_id }}-attempt${{ github.run_attempt }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          event: ci:agent-factory-failure
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          vite_supabase_url: ${{ secrets.VITE_SUPABASE_URL }}
          supabase_service_role_key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
