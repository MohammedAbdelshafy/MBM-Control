name: MBM Social CI

on:
  push:
    paths:
      - 'clipping-factory/MBM-Social/**'
  pull_request:
    paths:
      - 'clipping-factory/MBM-Social/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-brands:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate BrandRegistry.json
        run: |
          python3 << 'EOF'
          import json, sys

          with open('clipping-factory/MBM-Social/BrandRegistry.json') as f:
              data = json.load(f)

          brands = data.get('brands', {})
          issues_found = 0

          print(f'## Brand Validation')
          print(f'Total brands: {len(brands)}')
          print()

          for name, cfg in brands.items():
              issues = []
              if not cfg.get('display_name'): issues.append('missing display_name')
              if not cfg.get('handle'): issues.append('missing handle')
              if not cfg.get('active', False): issues.append('inactive')
              if not cfg.get('config_path'): issues.append('missing config_path')
              if issues:
                  issues_found += 1
                  print(f'- {name}: FAIL | {", ".join(issues)}')
              else:
                  print(f'- {name}: OK')

          if issues_found:
              print()
              print(f'Issues found: {issues_found}')
              sys.exit(1)
          EOF

  check-brand-dirs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: validate-brands
    steps:
      - uses: actions/checkout@v4
      - name: Verify brand config directories
        run: |
          python3 << 'EOF'
          import json, os

          with open('clipping-factory/MBM-Social/BrandRegistry.json') as f:
              data = json.load(f)

          missing = 0
          print('## Brand Config Directories')

          for name, cfg in data.get('brands', {}).items():
              path = cfg.get('config_path', '')
              full = os.path.join('clipping-factory/MBM-Social', path)
              exists = os.path.isdir(full)
              if exists:
                  print(f'- {name}: {path} OK')
              else:
                  missing += 1
                  print(f'- {name}: {path} MISSING')

          if missing:
              print()
              print(f'{missing} missing directorie(s)')
              exit(1)
          EOF

  test-pipeline-import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate-brands
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test pipeline imports
        run: |
          cd clipping-factory/MBM-Social
          python3 << 'EOF'
          import sys
          try:
              from mbm_social import (
                  model_registry,
                  brand_config,
                  brand_router,
                  publish_package,
                  pipeline,
                  autonomous_runtime,
                  learning_engine,
                  night_operations,
              )
              from mbm_social.pipeline import run_end_to_end, route_existing_clip
              from mbm_social.brand_router import route_clip, route_clip_dict, RouteResult
              from mbm_social.brand_config import load_brand, load_all_brands, active_brands
              from mbm_social.model_registry import resolve, generate, embed, cosine
              from mbm_social.publish_package import build_package, save_package
              assert callable(run_end_to_end)
              assert callable(route_clip)
              assert callable(load_brand)
              assert callable(resolve)
              assert callable(build_package)
              print('## Pipeline Import Test')
              print('All imports OK')
          except Exception as e:
              print(f'Import failed: {e}')
              sys.exit(1)
          EOF
