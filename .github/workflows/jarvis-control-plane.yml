name: JARVIS Control Plane Python Tests

on:
  pull_request:
    branches: [master]
    paths:
      - 'jarvis_control_plane/**'
      - 'MBM/GLM/**'
      - '.github/workflows/jarvis-control-plane.yml'
  workflow_dispatch:

concurrency:
  group: jarvis-control-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest pydantic requests python-dotenv
      - name: Run JARVIS control-plane tests
        run: python -m pytest jarvis_control_plane/tests -q
