name: Nightly Health Report

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check workflow files exist
        run: |
          echo "## Workflow Files" >> $GITHUB_STEP_SUMMARY
          for f in .github/workflows/*.yml; do
            if [ -f "$f" ]; then
              echo "- $f" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Check env.example coverage
        run: |
          echo "## Env File Coverage" >> $GITHUB_STEP_SUMMARY
          for dir in . clipping-factory MBM; do
            if [ -f "$dir/.env.example" ]; then
              echo "- $dir/.env.example: OK" >> $GITHUB_STEP_SUMMARY
            else
              echo "- $dir/.env.example: MISSING" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Check README freshness
        run: |
          echo "## README Freshness" >> $GITHUB_STEP_SUMMARY
          find . -name "README.md" -not -path "./node_modules/*" -not -path "./.venv/*" -not -path "./.git/*" | while read f; do
            age_days=$(python3 -c "import time,os; print(int((time.time()-os.path.getmtime('$f'))/86400))")
            if [ "$age_days" -gt 90 ]; then
              echo "- $f (${age_days}d) STALE" >> $GITHUB_STEP_SUMMARY
            else
              echo "- $f (${age_days}d)" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Summary
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Report generated $(date -u)" >> $GITHUB_STEP_SUMMARY
