name: Monthly Lead Pack Subscription — Build & Ship

on:
  schedule:
    - cron: '0 4 1 * *'   # 04:00 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      source:
        description: 'Lead source file path (relative to repo root). Omit to use the builder default.'
        type: string
        required: false

permissions:
  contents: read

jobs:
  build-lead-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build monthly lead pack
        id: build
        env:
          SOURCE: ${{ github.event.inputs.source || '' }}
        run: |
          ARGS=""
          if [ -n "$SOURCE" ]; then ARGS="--source $SOURCE"; fi
          # NOTE: lead_pack_builder.py has no --month flag; it stamps its own output.
          # Omit --source to use the builder default (fails cleanly if the file is absent).
          python MBM/LeadEngine/lead_pack_builder.py $ARGS \
            > lead_pack_result.json
          cat lead_pack_result.json

      - name: Write gate summary
        if: always()
        run: |
          {
            echo "## Monthly Lead Pack"
            echo "job.status=${{ job.status }}"
          } >> $GITHUB_STEP_SUMMARY
          python3 MBM/LeadEngine/lead_pack_summary.py lead_pack_result.json >> $GITHUB_STEP_SUMMARY

      - name: Upload Lead Pack deliverable
        uses: actions/upload-artifact@v4
        with:
          name: lead-pack-2026-deliverable
          path: |
            MBM/LeadEngine/artifacts/lead_packs/*.csv
            MBM/LeadEngine/artifacts/lead_packs/*.json
          if-no-files-found: warn

  notify-failure:
    runs-on: ubuntu-latest
    if: failure()
    needs: build-lead-pack
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Alert on lead pack failure
        uses: ./.github/actions/telegram-notify
        with:
          message: "🛑 *BASE44 LEAD PACK* monthly deliverable build FAILED\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          vite_supabase_url: ${{ secrets.VITE_SUPABASE_URL }}
          supabase_service_role_key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
