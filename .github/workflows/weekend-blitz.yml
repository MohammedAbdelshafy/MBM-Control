name: Weekend Blitz Monetization

on:
  schedule:
    # Run every 4 hours on Saturday and Sunday
    - cron: '0 */4 * * 6,0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekend-blitz
  cancel-in-progress: true

jobs:
  social-media-blast:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: pip install python-dotenv requests beautifulsoup4 2>/dev/null || true
      
      - name: Aggressive Social Media & Whop Promotion
        uses: nick-fields/retry@v3
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
          WHOP_ACCOUNT_ID: ${{ secrets.WHOP_ACCOUNT_ID }}
        with:
          timeout_minutes: 20
          max_attempts: 3
          command: |
            echo "🚀 WEEKEND BLITZ: Triggering massive social push..."
            python MBM/Scripts/master_publisher.py
            python register_instagram_tiktok_multichannel.py || true
            python MBM/Whop/whop_lifecycle_engage.py --aggressive
      
      - name: Notify on Blitz success
        if: success()
        uses: ./.github/actions/telegram-notify
        with:
          message: "🔥 *BASE44 WEEKEND BLITZ* completed successfully! Socials pumped.\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          vite_supabase_url: ${{ secrets.VITE_SUPABASE_URL }}
          supabase_service_role_key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
